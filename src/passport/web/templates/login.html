{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if error %}<p class="message error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="next" value="{{ next }}">
  <p><label for="email">Email</label><br><input id="email" name="email" type="email" required autocomplete="username"></p>
  <p><label for="password">Password</label><br><input id="password" name="password" type="password" required autocomplete="current-password"></p>
  <p><button type="submit">Sign in</button></p>
</form>
{% endblock %}
