{% extends "base.html" %}
{% block title %}Verify sign-in{% endblock %}
{% block content %}
<h1>Enter your authenticator code</h1>
{% if error %}<p class="message error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login/mfa">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="next" value="{{ next }}">
  <p><label for="code">Six-digit code, or a recovery code</label><br>
    <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required></p>
  <p><button type="submit">Verify</button></p>
</form>
{% endblock %}
